name: Python checks

on:
  push:
    branches: [ai-discovery-gemini]
  pull_request:
    branches: [ai-discovery-gemini]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile streamlit_app.py golden_set_evaluation.py groq_discovery.py
      - run: python -m unittest discover -s tests -v
